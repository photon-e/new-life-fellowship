<a href="{{ video.get_absolute_url }}" class="group block min-w-[16rem] overflow-hidden rounded-xl border border-zinc-800 bg-zinc-800/80 transition duration-300 hover:-translate-y-1 hover:scale-[1.02] hover:border-zinc-600 hover:shadow-2xl hover:shadow-black/40">
  <div class="relative aspect-video overflow-hidden bg-zinc-900">
    {% if video.thumbnail %}
      <img src="{{ video.thumbnail.url }}" alt="{{ video.title }}" class="h-full w-full object-cover transition duration-500 group-hover:scale-110">
    {% else %}
      <div class="flex h-full items-center justify-center text-zinc-500">No Thumbnail</div>
    {% endif %}
    <div class="absolute inset-0 flex items-center justify-center bg-black/20 opacity-0 transition group-hover:opacity-100">
      <span class="rounded-full bg-white/95 p-3 text-zinc-900">▶</span>
    </div>
    <span class="absolute bottom-2 right-2 rounded bg-black/80 px-2 py-0.5 text-xs font-semibold text-zinc-200">{{ video.duration|default:"--:--" }}</span>
  </div>
  <div class="space-y-1.5 p-4">
    <h3 class="text-sm font-semibold text-zinc-100">{{ video.title }}</h3>
    <p class="text-xs text-zinc-400">{{ video.speaker.name|default:"New Life Fellowship" }}</p>
  </div>
</a>
