<form action="{% url 'videos:list' %}" method="get" class="w-full max-w-md">
  <label for="nav-search" class="sr-only">Search videos</label>
  <div class="relative">
    <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-zinc-400">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M9 3a6 6 0 104.472 10.001l3.763 3.764a1 1 0 001.414-1.414l-3.764-3.763A6 6 0 009 3zm-4 6a4 4 0 118 0 4 4 0 01-8 0z" clip-rule="evenodd" />
      </svg>
    </span>
    <input id="nav-search" name="q" value="{{ request.GET.q|default:'' }}" placeholder="Search titles, speakers" class="w-full rounded-full border border-zinc-700 bg-zinc-900/90 py-2 pl-9 pr-3 text-sm text-zinc-100 placeholder-zinc-500 outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/40" />
  </div>
</form>
