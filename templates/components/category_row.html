<div class="flex gap-3 overflow-x-auto pb-2">
  {% for category in categories %}
    <a href="{% url 'videos:list' %}?category={{ category.slug }}" class="whitespace-nowrap rounded-full border border-zinc-700 bg-zinc-800/80 px-4 py-2 text-sm text-zinc-200 transition hover:border-red-500 hover:text-white">
      {{ category.name }}
      {% if category.video_count %}<span class="ml-1 text-zinc-400">({{ category.video_count }})</span>{% endif %}
    </a>
  {% empty %}
    <p class="text-sm text-zinc-400">No categories available.</p>
  {% endfor %}
</div>
