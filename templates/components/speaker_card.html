<a href="{{ speaker.get_absolute_url }}" class="group block rounded-xl border border-zinc-800 bg-zinc-800/70 p-4 transition hover:-translate-y-1 hover:border-zinc-600">
  <div class="mx-auto h-24 w-24 overflow-hidden rounded-full border border-zinc-700 bg-zinc-900">
    {% if speaker.photo %}
      <img src="{{ speaker.photo.url }}" alt="{{ speaker.name }}" class="h-full w-full object-cover transition duration-500 group-hover:scale-110">
    {% else %}
      <div class="flex h-full items-center justify-center text-sm text-zinc-500">{{ speaker.name|slice:":1" }}</div>
    {% endif %}
  </div>
  <h3 class="mt-3 text-center text-sm font-semibold text-zinc-100">{{ speaker.name }}</h3>
</a>
