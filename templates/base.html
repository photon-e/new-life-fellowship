{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="title" content="{% block meta_title %}New Life Fellowship International{% endblock %}" />
  <title>{% block title %}New Life Fellowship International{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#E50914'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-gray-900 text-zinc-100 antialiased">
  {% include "components/navigation_bar.html" %}

  <main class="mx-auto w-full max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}
</body>
</html>
