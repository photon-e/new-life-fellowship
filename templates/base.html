<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}New Life Fellowship Streaming{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-zinc-950 text-zinc-100">
  <header class="sticky top-0 z-50 border-b border-zinc-800 bg-zinc-950/95 backdrop-blur">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
      <a href="{% url 'home' %}" class="text-lg font-semibold tracking-wide text-emerald-400">NLF Stream</a>
      <div class="flex items-center gap-6 text-sm font-medium text-zinc-300">
        <a href="{% url 'home' %}" class="transition hover:text-white">Home</a>
        <a href="{% url 'videos:list' %}" class="transition hover:text-white">Videos</a>
        <a href="{% url 'categories:list' %}" class="transition hover:text-white">Categories</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
